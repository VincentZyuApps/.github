name: Update GitHub Stats

on:
  schedule:
    - cron: '30 */3 * * *'   # 每 3 小时（在语言统计后 30 分钟，错开执行）
  workflow_dispatch:          # 允许手动触发
  push:
    paths:
      - 'git-stats/**'       # Go 代码变更时也触发

jobs:
  update-git-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Run GitHub stats generator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./git-stats
        run: go run main.go

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f profile/github-stats.svg profile/README.md
          git diff --staged --quiet || (git commit -m "chore: auto-update GitHub stats [skip ci]" && git push)
