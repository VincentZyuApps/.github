name: Update Organization Language Stats

on:
  schedule:
    - cron: '0 */3 * * *'   # 每 3 小时自动运行
  workflow_dispatch:         # 允许手动触发
  push:
    paths:
      - 'lang-stats/**'     # Go 代码变更时也触发

jobs:
  update-lang-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 需要写权限来提交文件

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run language stats generator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./lang-stats
        run: go run main.go

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f profile/org-languages.svg profile/README.md
          git diff --staged --quiet || (git commit -m "chore: auto-update org language stats [skip ci]" && git push)
