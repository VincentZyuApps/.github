name: Update All Stats

on:
  workflow_dispatch:          # 手动触发
  push:
    branches:
      - main

jobs:
  update-all:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'update-all') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message
        run: echo "Triggered by: ${{ github.event.head_commit.message }}"

      # ===== 字体子集化 =====
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install font dependencies
        working-directory: ./sub-font
        run: pip install -r requirements.txt

      - name: Run font subset
        working-directory: ./sub-font
        run: python subset.py

      # ===== Go 出图 =====
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache: false

      - name: Run lang-stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./lang-stats
        run: go run main.go

      - name: Run git-stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./git-stats
        run: go run main.go

      - name: Run line-stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ./line-stats
        run: go run main.go

      # ===== 提交 =====
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f sub-font/output/ profile/
          git diff --staged --quiet && exit 0
          git commit -m "chore: auto-update all stats [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Retry $i..."
            sleep $((i * 5))
          done
