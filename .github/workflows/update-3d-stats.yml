name: Update 3D Stats

on:
  schedule:
    - cron: '45 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'conf/profile-3d-night.json'
      - 'profile/README.md'
      - '.github/workflows/update-3d-stats.yml'

jobs:
  update-3d-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate 3D contribution stats
        uses: VincentZyuApps/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: VincentZyu233
          ORG_NAME: VincentZyuApps
          ORG_INCLUDE_FORKS: 'true'
          PIE_LANG_SOURCE: org
          FOOTER_STAR_SOURCE: org
          FOOTER_FORK_SOURCE: org
          FOOTER_REPO_SOURCE: org
          SETTING_JSON: conf/profile-3d-night.json

      - name: Copy generated svg
        run: |
          mkdir -p profile
          cp profile-3d-contrib/profile-3d-night.svg profile/

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f profile/profile-3d-night.svg
          git diff --staged --quiet && exit 0
          git commit -m "chore: auto-update 3d stats [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Retry $i..."
            sleep $((i * 5))
          done
